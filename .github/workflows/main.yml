name: Build Protocol Sakha APK and EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Project Files
        run: |
          test -f index.html
          test -f package.json
          test -f capacitor.config.json

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/index.html

          if [ -f native-shim.js ]; then
            cp native-shim.js www/
          fi

          if [ -f NotoSansGujarati-Regular.ttf ]; then
            cp NotoSansGujarati-Regular.ttf www/
          fi

          if [ -f NotoSansGujarati-Bold.ttf ]; then
            cp NotoSansGujarati-Bold.ttf www/
          fi

          if [ -d assets ]; then
            cp -r assets www/
          fi

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund

      - name: Add Android Platform If Missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android Project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Protocol-Sakha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        run: npx electron-builder --win portable --x64

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Protocol-Sakha-EXE
          path: dist/*.exe
          if-no-files-found: error
