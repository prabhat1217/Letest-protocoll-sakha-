name: Build PROTOCOL SAKHA APK and EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f package.json
          test -f capacitor.config.json
          test -f icon.png
          test -f icon-foreground.png
          test -f icon-background.png
          test -f native-shim.js
          test -f native-plugins-entry.js
          test -f NotoSansGujarati-Regular.ttf
          test -f NotoSansGujarati-Bold.ttf

          mkdir -p cap/www/assets cap/www/lib cap/assets

          cp index.html cap/www/index.html
          cp native-shim.js cap/www/native-shim.js

          cp NotoSansGujarati-Regular.ttf \
             NotoSansGujarati-Bold.ttf cap/www/assets/

          cp icon.png icon-foreground.png \
             icon-background.png cap/assets/

          cp capacitor.config.json cap/
          cp native-plugins-entry.js cap/

          cd cap

          npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/filesystem@6 \
            @capacitor/share@6 \
            @capacitor/app@6 \
            --no-audit --no-fund

          npm install \
            html2canvas@1.4.1 \
            jspdf@2.5.1 \
            esbuild \
            --no-audit --no-fund

          npx esbuild native-plugins-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/lib/native-plugins.js

          cp node_modules/html2canvas/dist/html2canvas.min.js \
             www/lib/html2canvas.min.js

          cp node_modules/jspdf/dist/jspdf.umd.min.js \
             www/lib/jspdf.umd.min.js

          npm install --save-dev @capacitor/assets@3 \
            --no-audit --no-fund

          npx cap add android

          npx capacitor-assets generate --android

          npx cap sync android

      - name: Build Android APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Electron assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path www, www/assets, build | Out-Null

          Copy-Item index.html www/index.html -Force

          Copy-Item NotoSansGujarati-Regular.ttf, `
            NotoSansGujarati-Bold.ttf www/assets/ -Force

          Copy-Item icon.png build/icon.png -Force

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-EXE
          path: dist/*.exe
          if-no-files-found: error
